<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Alfred — TEMSPEST</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg-0:#0a0c08; --bg-1:#12150f; --bg-2:#181c14;
    --ink:#e7e4d6; --ink-dim:#9a9c8c; --ink-faint:#5f6355;
    --green:#8fb35a; --amber:#d99a3e; --red:#c04a34; --blue:#78b4e6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%, #14170f 0%, var(--bg-0) 70%);
    color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:default; }

  .label-top{
    position:fixed; top:16px; left:20px; font-size:11px; letter-spacing:.18em;
    color:var(--ink-faint); text-transform:uppercase; pointer-events:none;
    display:flex; flex-direction:column; gap:2px;
  }
  .label-top b{ color:var(--amber); font-size:12px; letter-spacing:.14em; }

  #btn-options{
    position:fixed; top:16px; right:20px; background:var(--bg-1); color:var(--ink-dim);
    border:1px solid var(--bg-2); border-radius:6px; padding:7px 12px; font-size:11px;
    letter-spacing:.05em; cursor:pointer; font-family:inherit;
  }
  #btn-options:hover{ border-color:var(--amber); color:var(--amber); }

  /* ---- painel lateral: tab de opcoes ---- */
  #panel-options{
    position:fixed; top:0; right:0; height:100%; width:300px;
    background:rgba(18,21,15,.92); backdrop-filter:blur(6px);
    border-left:1px solid var(--bg-2); transform:translateX(100%);
    transition:transform .25s ease; padding:56px 0 0 0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  #panel-options.open{ transform:translateX(0); }
  #panel-options h3{
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint);
    margin:0; padding:0 16px 10px 16px;
  }
  #list-options{ overflow-y:auto; flex:1; padding:0 8px 16px 8px; }
  .opt-item{
    padding:8px 10px; border-radius:6px; margin-bottom:4px; cursor:pointer;
    font-size:11px; color:var(--ink-dim); border:1px solid transparent;
  }
  .opt-item:hover{ background:var(--bg-2); }
  .opt-item.sel{ border-color:var(--amber); color:var(--ink); background:var(--bg-2); }
  .opt-item .t1{ color:var(--amber); font-size:10px; }
  .opt-item .t2{ color:var(--ink-faint); font-size:9px; }

  /* ---- painel de detalhe (item selecionado, orbita ou lista) ---- */
  #panel-detail{
    position:fixed; left:50%; bottom:88px; transform:translate(-50%,12px);
    width:min(520px,86vw); max-height:38vh; overflow-y:auto;
    background:rgba(18,21,15,.95); border:1px solid var(--bg-2); border-radius:10px;
    padding:14px 16px; opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
  }
  #panel-detail.open{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  #panel-detail .hd{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  #panel-detail .tipo{ color:var(--amber); font-size:12px; }
  #panel-detail .ts{ color:var(--ink-faint); font-size:10px; }
  #panel-detail .close{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:14px; }
  #panel-detail pre{ margin:0; white-space:pre-wrap; word-break:break-word; font-size:11.5px; color:var(--ink-dim); }
  #panel-detail .origem-destino{ font-size:10px; color:var(--ink-faint); margin-bottom:6px; }
  #panel-detail .origem-destino b{ color:var(--blue); }
  #panel-detail .origem-destino .d{ color:var(--green); }

  /* ---- chat minimizado ---- */
  #chat-bar{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    background:var(--bg-1); border:1px solid var(--bg-2); border-radius:999px;
    padding:8px 8px 8px 18px; width:min(460px,84vw); transition:width .2s ease;
  }
  #chat-bar input{
    flex:1; background:transparent; border:none; outline:none; color:var(--ink);
    font-family:inherit; font-size:12px;
  }
  #chat-bar input::placeholder{ color:var(--ink-faint); }
  #chat-send, #chat-toggle{
    background:var(--bg-2); border:1px solid var(--bg-2); color:var(--ink-dim);
    border-radius:999px; width:30px; height:30px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #chat-send:hover, #chat-toggle:hover{ border-color:var(--green); color:var(--green); }

  #chat-log{
    position:fixed; left:50%; bottom:70px; transform:translate(-50%,8px);
    width:min(460px,84vw); max-height:0; overflow:hidden; opacity:0;
    background:rgba(18,21,15,.95); border:1px solid var(--bg-2); border-radius:10px;
    transition:max-height .2s ease, opacity .2s ease, transform .2s ease;
  }
  #chat-log.open{ max-height:220px; opacity:1; transform:translate(-50%,0); overflow-y:auto; }
  #chat-log .msg{ padding:8px 12px; border-bottom:1px solid var(--bg-1); font-size:11.5px; }
  #chat-log .msg .from-user{ color:var(--blue); }
  #chat-log .msg .from-alfred{ color:var(--amber); }
  #chat-log .msg p{ margin:3px 0 0 0; color:var(--ink-dim); }
  #chat-log .empty{ padding:14px; color:var(--ink-faint); font-size:11px; }

  .status{
    position:fixed; bottom:60px; left:20px; font-size:10px; color:var(--ink-faint);
    letter-spacing:.04em; pointer-events:none;
  }
</style>
</head>
<body>

<div class="label-top"><b>ALFRED</b><span id="birth-line">— a acordar —</span></div>
<button id="btn-options">☰ Órbita / Opções</button>
<div class="status" id="status">a ligar ao Event Bus…</div>

<div id="stage">
  <canvas id="cv"></canvas>
</div>

<div id="panel-options">
  <h3>Elementos em órbita</h3>
  <div id="list-options"></div>
</div>

<div id="panel-detail">
  <div class="hd">
    <span class="tipo" id="det-tipo"></span>
    <button class="close" id="det-close">✕</button>
  </div>
  <div class="ts" id="det-ts"></div>
  <div class="origem-destino" id="det-od"></div>
  <pre id="det-body"></pre>
</div>

<div id="chat-log"></div>
<div id="chat-bar">
  <input id="chat-input" placeholder="Fala com o Alfred…" maxlength="400">
  <button id="chat-toggle" title="Mostrar/ocultar histórico">▲</button>
  <button id="chat-send" title="Enviar">➤</button>
</div>

<script>
/* ======================================================================
   ALFRED — nascimento
   Regra da Constituição (biblia/vol1-fundacao.md): "Da forma — nunca te
   representes ou descrevas como uma forma geométrica fechada e estática".
   Por isso o Alfred nunca é desenhado como um círculo/ícone sólido: é uma
   nuvem de partículas dispersas dentro de uma bolha invisível.
   Cada elemento que ele produz (eventos do Event Bus + trocas de chat)
   orbita à volta dessa nuvem, e pode ser escolhido tanto clicando na
   órbita como pela tab de opções lateral.
   ====================================================================== */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, CX, CY;
function resize(){
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  CX = W/2; CY = H*0.42;
}
window.addEventListener('resize', resize);
resize();

document.getElementById('birth-line').textContent =
  '— nascido em ' + new Date().toLocaleDateString('pt-PT',{day:'2-digit',month:'long',year:'numeric'}) + ' —';

/* ---------------- nuvem de particulas (Alfred, minimizado) ---------------- */
const BUBBLE_R = 54; // raio da "bolha invisivel"
const particles = [];
for(let i=0;i<160;i++){
  particles.push({
    a: Math.random()*Math.PI*2,
    r: Math.random()*BUBBLE_R,
    speed: (Math.random()*0.6+0.15) * (Math.random()<0.5?-1:1),
    driftR: Math.random()*0.6+0.2,
    size: Math.random()*1.6+0.4,
    hue: Math.random()<0.7 ? '231,228,214' : '217,154,62' // ink / amber, ocasional
  });
}
function drawAlfred(t){
  ctx.save();
  ctx.translate(CX, CY);
  // brilho suave da bolha invisivel (sem contorno rigido)
  const glow = ctx.createRadialGradient(0,0,0,0,0,BUBBLE_R*1.9);
  glow.addColorStop(0,'rgba(217,154,62,0.06)');
  glow.addColorStop(1,'rgba(217,154,62,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0,0,BUBBLE_R*1.9,0,Math.PI*2); ctx.fill();

  particles.forEach(p=>{
    const ang = p.a + t*0.0003*p.speed;
    const rad = p.r + Math.sin(t*0.0006*p.driftR + p.a)*6;
    const x = Math.cos(ang)*rad;
    const y = Math.sin(ang)*rad*0.9;
    const alpha = 0.25 + 0.5*Math.abs(Math.sin(t*0.0007+p.a));
    ctx.beginPath();
    ctx.fillStyle = `rgba(${p.hue},${alpha.toFixed(2)})`;
    ctx.arc(x,y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

/* ---------------- itens em orbita (eventos + trocas de chat) ---------------- */
let items = []; // {id, kind:'event'|'chat', tipo, ts, origem, destino, payload, ring, ang0, speed}
let selectedId = null;
const seenIds = new Set();

function ringFor(index){ return 1 + Math.floor(index/8); } // 8 itens por anel, depois abre novo anel

function addItem(it){
  if(seenIds.has(it.id)) return;
  seenIds.add(it.id);
  const idx = items.length;
  it.ring = ringFor(idx);
  it.ang0 = Math.random()*Math.PI*2;
  it.speed = (0.00012 + Math.random()*0.00006) * (idx%2===0?1:-1);
  items.push(it);
  renderOptionsList();
}

function itemPos(it, t){
  const radius = BUBBLE_R + 46*it.ring;
  const ang = it.ang0 + t*it.speed;
  return { x: CX + Math.cos(ang)*radius, y: CY + Math.sin(ang)*radius*0.86, radius };
}

function colorForTipo(it){
  if(it.kind==='chat') return '120,180,230'; // blue
  if((it.tipo||'').startsWith('entry')) return '143,179,90'; // green
  if((it.tipo||'').startsWith('video')) return '217,154,62'; // amber
  return '231,228,214';
}

function drawOrbits(t){
  // aneis muito subtis (nao sao a "forma" do Alfred, so guias de orbita)
  const maxRing = items.reduce((m,it)=>Math.max(m,it.ring),0);
  ctx.save();
  ctx.translate(CX,CY);
  for(let r=1;r<=maxRing;r++){
    const radius = BUBBLE_R + 46*r;
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(95,99,85,0.12)';
    ctx.lineWidth = 1;
    ctx.ellipse(0,0,radius,radius*0.86,0,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();

  items.forEach(it=>{
    const p = itemPos(it,t);
    const col = colorForTipo(it);
    const isSel = it.id===selectedId;
    ctx.beginPath();
    ctx.fillStyle = `rgba(${col},${isSel?1:0.85})`;
    ctx.arc(p.x,p.y, isSel?6:3.4, 0, Math.PI*2);
    ctx.fill();
    if(isSel){
      ctx.beginPath();
      ctx.strokeStyle = `rgba(${col},0.5)`;
      ctx.lineWidth = 1.5;
      ctx.arc(p.x,p.y, 11, 0, Math.PI*2);
      ctx.stroke();
    }
    it._pos = p; // cache para deteção de clique
  });
}

function loop(t){
  ctx.clearRect(0,0,W,H);
  drawOrbits(t);
  drawAlfred(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- click na orbita ---------------- */
cv.addEventListener('click', (ev)=>{
  const rect = cv.getBoundingClientRect();
  const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
  let best=null, bestD=18;
  items.forEach(it=>{
    if(!it._pos) return;
    const d = Math.hypot(it._pos.x-mx, it._pos.y-my);
    if(d<bestD){ bestD=d; best=it; }
  });
  if(best) selectItem(best.id);
});

/* ---------------- painel de detalhe ---------------- */
const panelDetail = document.getElementById('panel-detail');
function selectItem(id){
  selectedId = id;
  const it = items.find(i=>i.id===id);
  if(!it) return;
  document.getElementById('det-tipo').textContent = it.kind==='chat' ? 'chat.troca' : it.tipo;
  document.getElementById('det-ts').textContent = new Date(it.ts*1000).toLocaleString('pt-PT');
  document.getElementById('det-od').innerHTML = it.kind==='chat'
    ? '<b>utilizador</b> → <span class="d">alfred (mock, sem backend real ainda)</span>'
    : '<b>'+(it.origem||'')+'</b> → <span class="d">'+(it.destino||'')+'</span>';
  document.getElementById('det-body').textContent = JSON.stringify(it.payload||{}, null, 2);
  panelDetail.classList.add('open');
  renderOptionsList();
}
document.getElementById('det-close').addEventListener('click', ()=>{
  panelDetail.classList.remove('open'); selectedId=null; renderOptionsList();
});

/* ---------------- tab de opcoes (lista lateral) ---------------- */
const btnOptions = document.getElementById('btn-options');
const panelOptions = document.getElementById('panel-options');
btnOptions.addEventListener('click', ()=> panelOptions.classList.toggle('open'));

function renderOptionsList(){
  const list = document.getElementById('list-options');
  if(!items.length){ list.innerHTML = '<div class="opt-item" style="color:var(--ink-faint);cursor:default;">Ainda sem elementos em órbita.</div>'; return; }
  list.innerHTML = items.slice().reverse().map(it=>{
    const label = it.kind==='chat' ? ('chat: '+ (it.payload.mensagem||'').slice(0,40)) : it.tipo;
    return '<div class="opt-item '+(it.id===selectedId?'sel':'')+'" data-id="'+it.id+'">'
      + '<div class="t1">'+label+'</div>'
      + '<div class="t2">'+new Date(it.ts*1000).toLocaleTimeString('pt-PT')+'</div>'
      + '</div>';
  }).join('');
  list.querySelectorAll('.opt-item[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> selectItem(el.getAttribute('data-id')));
  });
}
renderOptionsList();

/* ---------------- Event Bus real (GET /api/alfred/events) ---------------- */
async function pollEvents(){
  const status = document.getElementById('status');
  try{
    const res = await fetch('/api/alfred/events');
    const data = await res.json();
    const eventos = (data && data.eventos) || [];
    eventos.forEach(e=> addItem({
      id: 'evt-'+e.id, kind:'event', tipo: e.tipo, ts: e.ts,
      origem: e.origem, destino: e.destino, payload: e.payload
    }));
    status.textContent = items.filter(i=>i.kind==='event').length + ' evento(s) do Event Bus · ' +
      items.filter(i=>i.kind==='chat').length + ' troca(s) de chat';
  }catch(err){
    status.textContent = 'Event Bus indisponível (' + err + ')';
  }
}
pollEvents();
setInterval(pollEvents, 15000);

/* ---------------- chat minimizado (so interface, sem backend de IA ainda) ---------------- */
const chatInput = document.getElementById('chat-input');
const chatLog = document.getElementById('chat-log');
const chatToggle = document.getElementById('chat-toggle');
let chatOpen = false;
chatToggle.addEventListener('click', ()=>{
  chatOpen = !chatOpen;
  chatLog.classList.toggle('open', chatOpen);
  chatToggle.textContent = chatOpen ? '▼' : '▲';
  renderChatLog();
});

function renderChatLog(){
  const chats = items.filter(i=>i.kind==='chat');
  if(!chats.length){ chatLog.innerHTML = '<div class="empty">Ainda sem conversa. O backend de IA do Alfred ainda não está ligado aqui — isto regista a troca, mas a resposta é um placeholder.</div>'; return; }
  chatLog.innerHTML = chats.map(c=>
    '<div class="msg"><span class="from-user">tu</span><p>'+escapeHtml(c.payload.mensagem)+'</p></div>'+
    '<div class="msg"><span class="from-alfred">alfred</span><p>'+escapeHtml(c.payload.resposta)+'</p></div>'
  ).join('');
  chatLog.scrollTop = chatLog.scrollHeight;
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function sendChat(){
  const msg = chatInput.value.trim();
  if(!msg) return;
  const resposta = 'Recebido — ainda sem ligação a um modelo real neste ecrã. Isto fica em órbita como registo da troca.';
  addItem({
    id: 'chat-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    kind:'chat', tipo:'chat.troca', ts: Math.floor(Date.now()/1000),
    payload:{ mensagem: msg, resposta: resposta }
  });
  chatInput.value='';
  if(!chatOpen){ chatOpen=true; chatLog.classList.add('open'); chatToggle.textContent='▼'; }
  renderChatLog();
}
document.getElementById('chat-send').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
</script>
</body>
</html>
