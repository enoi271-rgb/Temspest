<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfred</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050608; --line:rgba(255,255,255,.09); --mist:#8B98A8; --mist-dim:#4E5A64;
    --serif:'Spectral',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;}
  html,body{background:var(--ink);height:100%;overflow:hidden;}
  body{color:var(--mist);font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:1px solid var(--mist);outline-offset:3px;}

  .stage{position:relative;width:100%;height:100vh;}
  #cosmos{position:absolute;inset:0;display:block;width:100%;height:100%;}

  .id{position:absolute;top:22px;left:26px;z-index:5;pointer-events:none;}
  .id .nome{font-family:var(--serif);font-weight:300;font-size:15px;letter-spacing:.14em;
    color:rgba(255,255,255,.55);text-transform:uppercase;}
  .id .hora{font-size:10.5px;letter-spacing:.14em;color:var(--mist-dim);margin-top:3px;}

  .tabstrip{position:absolute;top:80px;right:0;z-index:6;display:flex;flex-direction:column;gap:2px;}
  .tab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mist-dim);background:rgba(6,9,12,.6);border:1px solid var(--line);border-right:none;
    padding:10px 13px;cursor:pointer;border-radius:3px 0 0 3px;
    transition:color .15s,background .15s;text-align:right;}
  .tab:hover{color:#D8E2E8;}
  .tab.active{color:#fff;background:rgba(6,9,12,.9);border-color:rgba(255,255,255,.22);}

  .sidepanel{position:absolute;top:80px;right:92px;z-index:5;width:238px;
    background:rgba(6,9,12,.86);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:3px;padding:16px 17px;
    opacity:0;transform:translateX(8px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;}
  .sidepanel.show{opacity:1;transform:translateX(0);pointer-events:auto;}
  @media(max-width:640px){
    .sidepanel{right:70px;width:min(230px,58vw);}
    .tab{padding:9px 10px;font-size:9px;}
  }

  .r-title{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist-dim);margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.05);}
  .row:last-child{border:none;}
  .dot{width:5px;height:5px;border-radius:50%;flex:none;}
  .dot.on{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7);}
  .dot.off{background:var(--mist-dim);}
  .nm{flex:1;color:#D8E2E8;}
  .nt{font-size:9px;color:var(--mist-dim);}

  .tier-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;padding:5px 0;font-size:10.5px;border-bottom:1px solid rgba(255,255,255,.05);}
  .tier-row:last-child{border:none;}
  .tier-row b{font-family:var(--serif);color:var(--mist-dim);font-weight:300;}
  .tier-row .c{font-size:8.5px;color:var(--mist-dim);text-transform:uppercase;letter-spacing:.05em;}

  .fev{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:10.5px;}
  .fev:last-child{border:none;}
  .fev-top{display:flex;justify-content:space-between;gap:8px;}
  .fev-type{color:#D8E2E8;}
  .fev-ts{color:var(--mist-dim);font-size:9px;}
  .fev-route{font-size:9px;color:var(--mist-dim);margin-top:2px;}
  .vazio{font-size:10.5px;color:var(--mist-dim);line-height:1.6;}

  .speak{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:7;
    display:flex;align-items:center;gap:10px;
    background:rgba(6,9,12,.66);border:1px solid var(--line);border-radius:20px;
    padding:9px 14px 9px 16px;width:min(430px,74vw);backdrop-filter:blur(6px);}
  .speak input{flex:1;background:transparent;border:none;color:#E8F0F2;font-family:var(--serif);
    font-style:italic;font-size:13px;outline:none;}
  .speak input::placeholder{color:var(--mist-dim);font-style:italic;}
  .speak-dot{width:6px;height:6px;border-radius:50%;background:var(--mist-dim);flex:none;}

  @media(prefers-reduced-motion:reduce){.sidepanel{transition:none;}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cosmos"></canvas>

  <div class="id">
    <div class="nome">Alfred</div>
    <div class="hora" id="relogio">—:—</div>
  </div>

  <div class="tabstrip">
    <div class="tab" data-p="divisoes" role="button" tabindex="0">Divisões</div>
    <div class="tab" data-p="tiers" role="button" tabindex="0">Tiers</div>
    <div class="tab" data-p="bus" role="button" tabindex="0">Event Bus</div>
  </div>

  <div class="sidepanel" data-panel="divisoes">
    <div class="r-title">Agentes e divisões</div>
    <div class="row"><span class="dot on"></span><span class="nm">TEMSPEST AI OS</span><span class="nt">9 salas</span></div>
    <div class="row"><span class="dot off"></span><span class="nm">Casa</span><span class="nt">vazio</span></div>
    <div class="row"><span class="dot on"></span><span class="nm">R1 Criação</span><span class="nt">—</span></div>
    <div class="row"><span class="dot on"></span><span class="nm">R4 Financeiro</span><span class="nt">—</span></div>
  </div>

  <div class="sidepanel" data-panel="tiers">
    <div class="r-title">Tiers &middot; Artigo VII</div>
    <div class="tier-row"><b>1</b><span>Informar / sugerir</span><span class="c">livre</span></div>
    <div class="tier-row"><b>2</b><span>Notas, rascunhos</span><span class="c">sem confirmar</span></div>
    <div class="tier-row"><b>3</b><span>Rotina, agendar</span><span class="c">1.ª vez</span></div>
    <div class="tier-row"><b>4</b><span>Dinheiro / dados</span><span class="c">confirmar sempre</span></div>
  </div>

  <div class="sidepanel" data-panel="bus">
    <div class="r-title">Event Bus</div>
    <div id="feed"><div class="vazio">A ler…</div></div>
  </div>

  <div class="speak">
    <input type="text" id="entrada" placeholder="fala com o Alfred…" disabled aria-label="Falar com o Alfred">
    <span class="speak-dot" id="speak-dot" title="ligação à IA por ativar"></span>
  </div>
</div>

<script>
'use strict';

function relogio(){
  const d=new Date();
  document.getElementById('relogio').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
relogio(); setInterval(relogio,1000);

function abrirPainel(tab){
  const alvo=tab.dataset.p, ativo=tab.classList.contains('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sidepanel').forEach(p=>p.classList.remove('show'));
  if(!ativo){
    tab.classList.add('active');
    document.querySelector('.sidepanel[data-panel="'+alvo+'"]').classList.add('show');
  }
}
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>abrirPainel(tab));
  tab.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrirPainel(tab);} });
});

const cv=document.getElementById('cosmos'), cx=cv.getContext('2d');
const reduzir=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,RAIO;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
  RAIO=Math.min(W,H)*0.30;
}

/* Amostra a letra, mede a tinta real, e re-mapeia para uma caixa de proporção
   controlada e centrada — é isto que impede o E de sair alto e estreito. */
function pontosDaLetra(letra,quantos){
  const S=520;
  const off=document.createElement('canvas');
  off.width=S; off.height=S;
  const o=off.getContext('2d');
  o.fillStyle='#fff';
  o.font='900 '+Math.floor(S*0.78)+'px Arial, Helvetica, sans-serif';
  o.textAlign='center'; o.textBaseline='middle';
  o.fillText(letra, S/2, S/2);

  const d=o.getImageData(0,0,S,S).data;
  const brutos=[];
  for(let y=0;y<S;y+=2){
    for(let x=0;x<S;x+=2){
      if(d[(y*S+x)*4+3]>90) brutos.push([x,y]);
    }
  }
  if(!brutos.length) return [];

  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const [x,y] of brutos){
    if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  const lw=maxX-minX||1, lh=maxY-minY||1;

  const altura=Math.min(W,H)*0.46;
  const escala=altura/lh;
  const larg=lw*escala;

  const passo=Math.max(1,Math.floor(brutos.length/quantos));
  const pts=[];
  for(let i=0;i<brutos.length;i+=passo){
    const [x,y]=brutos[i];
    pts.push({
      x: W/2 - larg/2 + (x-minX)*escala + (Math.random()-0.5)*2,
      y: H/2 - altura/2 + (y-minY)*escala + (Math.random()-0.5)*2
    });
  }
  return pts;
}

const N=reduzir?280:680;
const P=[];

function inicializar(){
  const alvos=pontosDaLetra('E',N);
  P.length=0;
  for(let i=0;i<N;i++){
    const ang=Math.random()*6.283, r=Math.max(W,H)*0.75*Math.sqrt(Math.random());
    const alvo=alvos.length?alvos[i%alvos.length]:{x:W/2,y:H/2};
    const a2=Math.random()*6.283, r2=RAIO*Math.cbrt(Math.random());
    P.push({
      x:W/2+Math.cos(ang)*r, y:H/2+Math.sin(ang)*r,
      tx:alvo.x, ty:alvo.y,
      dx:Math.cos(a2)*r2, dy:Math.sin(a2)*r2*0.78,
      vx:(Math.random()-0.5)*0.32, vy:(Math.random()-0.5)*0.32,
      brilho:0.35+Math.random()*0.55, fase:Math.random()*6.283
    });
  }
}

resize(); inicializar();
window.addEventListener('resize',()=>{ resize(); if(fase==='formar'||fase==='segurar') inicializar(); });

let fase = reduzir ? 'cosmos' : 'formar';
let faseT0=performance.now();
const DUR={formar:2000,segurar:1100,dispersar:1700};

const CORES={
  repouso:[210,220,232],
  'r1-criacao':[120,190,235],
  'r2-negocios':[217,170,90],
  'r3-edicao':[150,180,215],
  'r4-financeiro':[140,210,150],
  'r5-publicidade':[190,150,225],
  'r6-web':[110,175,220],
  'r7-atendimento':[230,170,110],
  'r8-produtos':[225,205,110],
  alerta:[224,90,78]
};
let corAlvo=CORES.repouso.slice(), corAtual=CORES.repouso.slice(), trabalhoT=-1;

function ativarTrabalho(div){
  corAlvo=(CORES[div]||CORES.repouso).slice();
  trabalhoT=performance.now();
}
function tickCor(){
  if(trabalhoT>0 && performance.now()-trabalhoT>4000) corAlvo=CORES.repouso.slice();
  for(let i=0;i<3;i++) corAtual[i]+=(corAlvo[i]-corAtual[i])*0.03;
}

let faisca=-1e9;
function desenhar(now){
  cx.clearRect(0,0,W,H);
  tickCor();
  const cor=corAtual.map(v=>Math.round(v));
  const dt=now-faseT0;

  if(fase==='formar' && dt>DUR.formar){ fase='segurar'; faseT0=now; }
  else if(fase==='segurar' && dt>DUR.segurar){ fase='dispersar'; faseT0=now; }
  else if(fase==='dispersar' && dt>DUR.dispersar){ fase='cosmos'; }

  const CX=W/2, CY=H/2;

  for(const p of P){
    if(fase==='formar'||fase==='segurar'){
      const k = fase==='formar' ? Math.min(1,dt/DUR.formar) : 1;
      const e = 1-Math.pow(1-k,3);
      p.x += (p.tx-p.x)*0.16*e;
      p.y += (p.ty-p.y)*0.16*e;
      p.b = fase==='segurar' ? 0.95 : 0.45+e*0.55;
    } else if(fase==='dispersar'){
      const k=Math.min(1,(now-faseT0)/DUR.dispersar);
      p.x += ((CX+p.dx)-p.x)*0.045*k;
      p.y += ((CY+p.dy)-p.y)*0.045*k;
      p.b = p.brilho;
    } else {
      p.x += p.vx; p.y += p.vy;
      const ax=p.x-CX, ay=(p.y-CY)/0.78, d=Math.hypot(ax,ay);
      if(d>RAIO){
        const k=RAIO/d;
        p.x=CX+ax*k; p.y=CY+ay*k*0.78;
        p.vx=-p.vx*0.9; p.vy=-p.vy*0.9;
      }
      p.b=p.brilho;
    }

    p.fase+=0.013;
    const a=Math.max(0,Math.min(1,(p.b||p.brilho)*(0.7+Math.sin(p.fase)*0.3)));
    cx.fillStyle='rgba('+cor[0]+','+cor[1]+','+cor[2]+','+a.toFixed(3)+')';
    cx.beginPath(); cx.arc(p.x,p.y,fase==='segurar'?2:1.6,0,6.283); cx.fill();
  }

  const df=(now-faisca)/1200;
  if(fase==='cosmos' && df>=0 && df<1){
    const y=H*0.15+df*H*0.7;
    cx.fillStyle='rgba('+cor[0]+','+cor[1]+','+cor[2]+','+(0.10*(1-df))+')';
    cx.fillRect(0,y-40,W,80);
  }

  requestAnimationFrame(desenhar);
}
requestAnimationFrame(desenhar);

/* ═══ Event Bus real ═══ */
const DIV={'r1-criacao':'R1 Criação','r2-negocios':'R2 Negócios','r3-edicao':'R3 Edição',
  'r4-financeiro':'R4 Financeiro','r5-publicidade':'R5 Publicidade','r6-web':'R6 Web',
  'r7-atendimento':'R7 Atendimento','r8-produtos':'R8 Produtos'};
function nomeDiv(r){ if(!r||r==='*')return 'qualquer divisão'; const p=String(r).split('.').pop(); return DIV[p]||p; }
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function quando(ts){const s=Math.floor(Date.now()/1000)-ts; if(s<60)return 'agora'; if(s<3600)return Math.floor(s/60)+' min'; if(s<86400)return Math.floor(s/3600)+' h'; return Math.floor(s/86400)+' d';}

let vistos=new Set(), primeira=true;

function pintar(eventos){
  const host=document.getElementById('feed');
  if(!eventos.length){
    host.innerHTML='<div class="vazio">Sem eventos ainda. Regista um movimento no razão ou gera hype — a linha aparece aqui.</div>';
    return;
  }
  host.innerHTML=eventos.slice(-12).reverse().map(e=>{
    const carga=Object.entries(e.payload||{}).map(([k,v])=>esc(k)+': '+esc(v)).join('   ');
    return '<div class="fev"><div class="fev-top"><span class="fev-type">'+esc(e.tipo||'—')+'</span>'+
      '<span class="fev-ts">'+quando(e.ts||0)+'</span></div>'+
      '<div class="fev-route">'+esc(nomeDiv(e.origem))+' → '+esc(nomeDiv(e.destino))+(carga?' · '+carga:'')+'</div></div>';
  }).join('');

  for(const e of eventos){
    if(e.id && !vistos.has(e.id)){
      vistos.add(e.id);
      if(!primeira){
        faisca=performance.now();
        const d=String(e.origem||'').split('.').pop();
        ativarTrabalho(d);
      }
    }
  }
  primeira=false;
}

async function ler(){
  try{
    const r=await fetch('/api/alfred/events',{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    if(!Array.isArray(d.eventos)) throw new Error('formato');
    if(corAlvo===CORES.alerta) corAlvo=CORES.repouso.slice();
    pintar(d.eventos);
  }catch(err){
    corAlvo=CORES.alerta.slice(); trabalhoT=performance.now();
    document.getElementById('feed').innerHTML=
      '<div class="vazio">Não consigo ler o Event Bus. A estação está ligada?</div>';
  }
}
ler(); setInterval(ler,6000);
</script>
</body>
</html>
